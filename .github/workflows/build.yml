          GBEOF
          mkdir -p "$(dirname app/src/main/java/com/gamebooster/app/SystemInfo.kt)"
          cat > app/src/main/java/com/gamebooster/app/SystemInfo.kt <<'GBEOF'
          package com.gamebooster.app

          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import java.io.File

          object SystemInfo {

              data class Mem(val total: Long, val avail: Long) {
                  val used: Long get() = total - avail
                  val percent: Int get() = if (total > 0) ((used * 100) / total).toInt() else 0
              }

              data class Battery(val level: Int, val tempC: Float, val charging: Boolean)

              fun memory(ctx: Context): Mem {
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val info = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(info)
                  return Mem(info.totalMem, info.availMem)
              }

              fun battery(ctx: Context): Battery {
                  val i: Intent? = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val temp = (i?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                  val status = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                          status == BatteryManager.BATTERY_STATUS_FULL
                  val pct = if (level >= 0 && scale > 0) level * 100 / scale else -1
                  return Battery(pct, temp, charging)
              }

              private fun readLong(path: String): Long =
                  try {
                      File(path).readText().trim().toLong()
                  } catch (e: Exception) {
                      -1L
                  }

              /** Frequência média atual dos núcleos em relação à máxima (0-100), ou null se o aparelho bloquear a leitura. */
              fun cpuPercent(): Int? {
                  var sum = 0.0
                  var n = 0
                  for (i in 0 until cpuCores()) {
                      val base = "/sys/devices/system/cpu/cpu$i/cpufreq/"
                      val cur = readLong(base + "scaling_cur_freq")
                      val max = readLong(base + "cpuinfo_max_freq")
                      if (cur > 0 && max > 0) {
                          sum += cur.toDouble() / max.toDouble()
                          n++
                      }
                  }
                  return if (n > 0) ((sum / n) * 100).toInt().coerceIn(0, 100) else null
              }

              fun cpuCores(): Int = Runtime.getRuntime().availableProcessors()
          }
          GBEOF
          mkdir -p "$(dirname app/src/main/java/com/gamebooster/app/Booster.kt)"
          cat > app/src/main/java/com/gamebooster/app/Booster.kt <<'GBEOF'
          package com.gamebooster.app

          import android.app.ActivityManager
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.graphics.drawable.Drawable
          import android.os.Build

          object Booster {

              data class AppItem(val label: String, val pkg: String, val icon: Drawable, val isGame: Boolean)

              // Apps essenciais que nunca são tocados na limpeza
              private val PROTECTED = listOf(
                  "com.android.phone",
                  "com.android.dialer",
                  "com.google.android.dialer",
                  "com.android.mms",
                  "com.google.android.apps.messaging",
                  "com.android.systemui",
                  "com.android.settings"
              )

              @Suppress("DEPRECATION")
              private fun isGame(ai: ApplicationInfo): Boolean {
                  if (Build.VERSION.SDK_INT >= 26 && ai.category == ApplicationInfo.CATEGORY_GAME) return true
                  return (ai.flags and ApplicationInfo.FLAG_IS_GAME) != 0
              }

              fun launcherApps(ctx: Context): List<AppItem> {
                  val pm = ctx.packageManager
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val result = ArrayList<AppItem>()
                  for (ri in pm.queryIntentActivities(intent, 0)) {
                      val ai = ri.activityInfo.applicationInfo
                      if (ai.packageName == ctx.packageName) continue
                      result.add(AppItem(ri.loadLabel(pm).toString(), ai.packageName, ri.loadIcon(pm), isGame(ai)))
                  }
                  return result.distinctBy { it.pkg }.sortedBy { it.label.lowercase() }
              }

              /** Pede ao Android para encerrar processos em segundo plano. Retorna quantos apps foram processados. */
              fun cleanBackground(ctx: Context, keep: String?): Int {
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  var count = 0
                  for (app in launcherApps(ctx)) {
                      if (app.pkg == keep) continue
                      if (PROTECTED.any { app.pkg.startsWith(it) }) continue
                      try {
                          am.killBackgroundProcesses(app.pkg)
                          count++
                      } catch (e: Exception) {
                          // ignora apps que não permitem
                      }
                  }
                  return count
              }

              private fun nm(ctx: Context) =
                  ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

              fun hasDndAccess(ctx: Context): Boolean = nm(ctx).isNotificationPolicyAccessGranted

              fun enableDnd(ctx: Context): Boolean {
                  val n = nm(ctx)
                  if (!n.isNotificationPolicyAccessGranted) return false
                  val cur = n.currentInterruptionFilter
                  if (cur != NotificationManager.INTERRUPTION_FILTER_PRIORITY) {
                      ctx.getSharedPreferences("gb", Context.MODE_PRIVATE).edit().putInt("prev_filter", cur).apply()
                  }
                  n.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_PRIORITY)
                  return true
              }

              fun disableDnd(ctx: Context): Boolean {
                  val n = nm(ctx)
                  if (!n.isNotificationPolicyAccessGranted) return false
                  val prev = ctx.getSharedPreferences("gb", Context.MODE_PRIVATE)
                      .getInt("prev_filter", NotificationManager.INTERRUPTION_FILTER_ALL)
                  val restore = if (prev == NotificationManager.INTERRUPTION_FILTER_UNKNOWN)
                      NotificationManager.INTERRUPTION_FILTER_ALL else prev
                  n.setInterruptionFilter(restore)
                  return true
              }

              fun launch(ctx: Context, pkg: String): Boolean {
                  val i = ctx.packageManager.getLaunchIntentForPackage(pkg) ?: return false
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      ctx.startActivity(i)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          GBEOF
